# EventHorizon docker-compose: tarpit + OpenTelemetry Collector + Jaeger.
#
# SAFETY: the tarpit ports are published to 127.0.0.1 only by default, so the
# demo never exposes the honeypot to your LAN/Internet. To run a real honeynet,
# change the published host binding deliberately and isolate the network.

services:
  tarpit:
    build: .
    image: eventhorizon-tarpit:latest
    container_name: eventhorizon-tarpit
    environment:
      EH_HOST: "0.0.0.0"            # inside the container only
      EH_TELNET_PORT: "2323"
      EH_HTTP_PORT: "8080"
      EH_SSH_PORT: "2222"
      EH_SSDP_PORT: "1900"
      EH_OTEL_ENABLED: "true"
      EH_OTEL_ENDPOINT: "http://otel-collector:4317"
      EH_LOG_FILE: "/data/sessions.jsonl"
      EH_ADAPTIVE_ENABLED: "true"
      EH_DASHBOARD_ENABLED: "true"
      EH_DASHBOARD_PORT: "8090"
    volumes:
      - tarpit-data:/data
    ports:
      # host:container — bound to localhost for a safe demo.
      - "127.0.0.1:2323:2323"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:1900:1900/udp"   # SSDP/UPnP discovery (UDP)
      - "127.0.0.1:8090:8090"       # live dashboard: SSE + /metrics
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: eventhorizon-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: eventhorizon-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI -> http://127.0.0.1:16686
    restart: unless-stopped

volumes:
  tarpit-data:
